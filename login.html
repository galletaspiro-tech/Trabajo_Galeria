<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Galería Secreta</title>
  <link rel="stylesheet" href="CSS/login.css">
</head>
<body>

 

  <!-- SECCIÓN LOGIN -->
  <section class="login-section">
    <div class="login-container">
      <div class="login-card">
        
        <div class="login-header">
          <h2> Bienvenido de vuelta</h2>
          <p>Inicia sesión para continuar en Galería Secreta</p>
        </div>

        <form class="login-form" action="#" method="POST">
          
          <!-- Correo -->
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="tu@correo.com" required>
          </div>

          <!-- Contraseña -->
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password"  required>
          </div>

          <!-- Recordarme y Olvidé contraseña -->
          <div class="login-options">
            <label class="remember-me">
              <input type="checkbox" id="remember">
              <span>Recordarme</span>
            </label>
            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- Botón Iniciar Sesión -->
          <button type="submit" class="btn-login">Iniciar Sesión</button>

          <!-- Separador -->
          <div class="login-divider">
            <span>o continúa con</span>
          </div>

          <!-- Redes Sociales -->
          <div class="social-login">
            <a href="#" class="social-btn google">
              <span></span> Google
            </a>
            <a href="#" class="social-btn facebook">
              <span></span> Facebook
            </a>
          </div>

          <!-- Ir a Registro -->
          <p class="login-register">
            ¿No tienes cuenta? <a href="perfil.html">Regístrate aquí</a>
          </p>

        </form>
      </div>
    </div>
  </section>

  <
 

</body>
</html>
